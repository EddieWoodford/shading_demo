[project]
name = "shading-demo"
version = "0.1.0"
description = "Browser demo of shading and disconnection in a 10-panel PV string (pvlib + Flask)"
requires-python = ">=3.10"
dependencies = ["pvlib>=0.11", "flask>=3.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
